services:
  postgres:
    image: postgres:16-alpine
    container_name: iet-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iet_dashboard
      POSTGRES_USER: iet_user
      POSTGRES_PASSWORD: iet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iet_user -d iet_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: iet-dashboard-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
