# Production. Every secret comes from the environment; there are no defaults to fall back on.
server:
  # Hosts such as Render tell the app which port to listen on through $PORT.
  port: ${PORT:8080}
  forward-headers-strategy: framework   # behind the nginx reverse proxy (X-Forwarded-*)
  tomcat:
    # Send "Location: /" instead of an absolute URL, so the redirect after sign-in always lands on the
    # host the browser used (the Vercel domain when Vercel proxies to Render), whatever the proxy forwards.
    use-relative-redirects: true
  servlet:
    session:
      timeout: 8h
      cookie:
        secure: true
        http-only: true
        same-site: lax

spring:
  datasource:
    # One of: DATABASE_URL (Render's Internal Database URL, postgresql://user:pass@host/db),
    # a full SPRING_DATASOURCE_URL, or DB_HOST / DB_PORT / DB_NAME. SPRING_DATASOURCE_* always win.
    url: ${SPRING_DATASOURCE_URL:${app.db.url:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}}
    username: ${SPRING_DATASOURCE_USERNAME:${app.db.username:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${app.db.password:}}
  mail:
    host: ${SPRING_MAIL_HOST:}   # optional: reminder emails only
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:true}
  # Microsoft Entra sign-in lives in application-entra.yml: run with SPRING_PROFILES_ACTIVE=prod,entra
  # once ENTRA_TENANT_ID / ENTRA_CLIENT_ID / ENTRA_CLIENT_SECRET are set.

app:
  auth:
    dev-mode: false
    bypass-key: ""
    allowed-email-domains: ${APP_ALLOWED_EMAIL_DOMAINS:jklu.edu.in}
  admin:
    destructive-actions: false
  security:
    csrf: true
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:/data/uploads}
  # Render's free plan sleeps after 15 idle minutes; the app pings its own public URL every 10.
  # Render sets RENDER_EXTERNAL_URL itself. Set APP_KEEP_AWAKE_URL= (empty) to switch this off.
  keep-awake:
    url: ${APP_KEEP_AWAKE_URL:${RENDER_EXTERNAL_URL:}}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  health:
    mail:
      enabled: false   # a mail outage must not mark the app unhealthy (Render would stop routing to it)
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
